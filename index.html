
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Craigslist Relay Email Submission</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.container {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
  color: #111827;
  margin-top: 0;
}

.description {
  text-align: center;
  color: #6b7280;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 22px;
}

input[type="email"] {
  width: 100%;
  padding: 15px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 18px;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 13px;
  color: #4b5563;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
}

.success { color: #15803d; }
.error { color: #dc2626; }
</style>
</head>

<body>
<div class="container">

<h2>Relay Email Submission</h2>

<p class="description">
Submit your own Craigslist relay email address
with your consent.
</p>

<form id="emailForm">

<input
type="email"
id="email"
name="email"
placeholder="Enter Craigslist relay email"
pattern="[A-Za-z0-9._%+-]+@reply\.craigslist\.org"
title="Enter an email ending in @reply.craigslist.org"
required>

<label class="consent">
<input type="checkbox" name="consent" value="yes" required>
<span>
I confirm that this is my own email address
or an address I am authorized to submit.
I agree to its processing for the stated purpose.
</span>
</label>

<button type="submit" id="submitBtn">
Submit Email
</button>

</form>

<p id="message" aria-live="polite"></p>

</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzLrBF7EZagzQsxK96vGdoR8NeM8192ufJ0JrCuOw-cX_y3AoS6cMLPMiyBSHrjwPEEEA/exec";

const form = document.getElementById("emailForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  if (!form.reportValidity()) return;

  button.disabled = true;
  button.textContent = "Submitting...";
  message.textContent = "";
  message.className = "";

  try {
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      body: new FormData(form)
    });

    if (!response.ok) {
      throw new Error("Server error");
    }

    const result = await response.json();

    if (!result.success) {
      throw new Error(result.message || "Submission failed.");
    }

    message.textContent = "Submission successful!";
    message.className = "success";
    form.reset();

  } catch (error) {
    message.textContent =
      "Unable to confirm submission. Please try again.";
    message.className = "error";
  } finally {
    button.disabled = false;
    button.textContent = "Submit Email";
  }
});
</script>

</body>
</html>
