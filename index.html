
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Email Submission</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 30px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
  color: #111827;
}

.description {
  text-align: center;
  color: #6b7280;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 22px;
}

input[type="email"] {
  width: 100%;
  padding: 15px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 18px;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 13px;
  color: #4b5563;
  line-height: 1.5;
}

.consent input {
  margin-top: 3px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.success {
  color: #15803d;
}

.error {
  color: #dc2626;
}

iframe {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h2>Relay Email Submission</h2>

<p class="description">
Submit your own Craigslist relay email address
with your consent.
</p>

<form
  id="emailForm"
  method="POST"
  target="submissionFrame"
  action="https://script.google.com/macros/s/AKfycbwlPHdAmNrF8Q3DniSKRJUW9iSHglUWUTKI3hr3ZQiqaOlhFpmFdN3MAY31mQN4gmnFog/exec">

  <input
    type="email"
    name="email"
    id="email"
    placeholder="Enter Craigslist relay email"
    pattern="[A-Za-z0-9._%+-]+@reply\.craigslist\.org"
    title="Enter an email ending in @reply.craigslist.org"
    required>

  <label class="consent">
    <input
      type="checkbox"
      name="consent"
      value="yes"
      required>

    <span>
      I confirm that this is my own email address
      or an address I am authorized to submit.
      I agree to its processing for the stated purpose.
    </span>
  </label>

  <button type="submit" id="submitBtn">
    Submit Email
  </button>

</form>

<iframe
  name="submissionFrame"
  id="submissionFrame"
  title="Submission response">
</iframe>

<p id="message" aria-live="polite"></p>

</div>

<script>
const form = document.getElementById("emailForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");
const frame = document.getElementById("submissionFrame");

let submitting = false;
let responseReceived = false;
let timeoutId;

// Submit form
form.addEventListener("submit", function(e) {

  if (submitting) {
    e.preventDefault();
    return;
  }

  if (!form.reportValidity()) {
    e.preventDefault();
    return;
  }

  submitting = true;
  responseReceived = false;

  button.disabled = true;
  button.textContent = "Submitting...";

  message.textContent = "Please wait. Sending your submission...";
  message.className = "";

  timeoutId = setTimeout(function() {

    if (submitting && !responseReceived) {
      finish(false,
        "No server confirmation received. Please check your connection and try again.");
    }

  }, 30000);

});

// Receive Apps Script response
window.addEventListener("message", function(event) {

  if (event.source !== frame.contentWindow) return;

  if (!event.data || event.data.type !== "relay-result") return;

  if (!submitting) return;

  responseReceived = true;

  finish(
    event.data.success === true,
    event.data.message || "Server response received."
  );

});

// Finish submission
function finish(success, text) {

  submitting = false;
  clearTimeout(timeoutId);

  button.disabled = false;
  button.textContent = "Submit Email";

  message.textContent = text;

  if (success) {
    message.className = "success";
    form.reset();
  } else {
    message.className = "error";
  }
}

</script>

</body>
</html>
