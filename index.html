
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relay Email Submission</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f3f5f9;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 420px;
  background: #fff;
  padding: 30px 24px;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  color: #222;
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 25px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 9px;
  color: #333;
}

input[type="email"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

input[type="email"]:focus {
  border-color: #2563eb;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin: 20px 0;
  font-size: 13px;
  color: #555;
  line-height: 1.5;
}

.consent input {
  margin-top: 3px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

#message {
  display: none;
  margin-top: 18px;
  padding: 12px;
  border-radius: 7px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
}

.success {
  display: block !important;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block !important;
  background: #fee2e2;
  color: #991b1b;
}
</style>
</head>

<body>

<div class="container">

  <h2>Relay Email Submission</h2>

  <p class="subtitle">
    Submit your Craigslist relay email address below.
  </p>

  <form id="relayForm">

    <label for="email">Craigslist Relay Email</label>

    <input
      type="email"
      id="email"
      name="email"
      placeholder="example@reply.craigslist.org"
      required
    >

    <div class="consent">
      <input
        type="checkbox"
        id="consent"
        name="consent"
        value="yes"
        required
      >

      <label for="consent">
        I confirm that I own or am authorized to submit
        this email address.
      </label>
    </div>

    <button type="submit" id="submitBtn">
      Submit Email
    </button>

  </form>

  <div id="message"></div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzmIIJrrFdQjuYNZLjiKkI-gnCjKC6ovclawWI3Wc16Xp_7Av2m1m5tLrpjciY1RZIbYg/exec";

const form = document.getElementById("relayForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

let submitting = false;

form.addEventListener("submit", function(e) {

  e.preventDefault();

  if (submitting) return;

  const email = document.getElementById("email").value.trim();
  const consent = document.getElementById("consent").checked;

  const emailPattern =
  /^[A-Za-z0-9._%+-]+@reply\.craigslist\.org$/i;

  if (!emailPattern.test(email)) {
    showMessage("Please enter a valid Craigslist relay email.", false);
    return;
  }

  if (!consent) {
    showMessage("Please accept the consent checkbox.", false);
    return;
  }

  submitting = true;
  button.disabled = true;
  button.textContent = "Submitting...";

  message.className = "";
  message.style.display = "none";

  const formData = new FormData();

  formData.append("email", email);
  formData.append("consent", "yes");

  fetch(SCRIPT_URL, {
    method: "POST",
    body: formData
  })
  .then(response => response.text())
  .then(result => {

    // Google Apps Script response may be HTML.
    // The iframe message method is used below instead.

    showMessage(
      "Your request has been sent. Please wait for confirmation.",
      true
    );

    form.reset();

  })
  .catch(error => {

    showMessage(
      "Submission failed. Please try again.",
      false
    );

  })
  .finally(() => {

    submitting = false;
    button.disabled = false;
    button.textContent = "Submit Email";

  });

});

function showMessage(text, success) {

  message.textContent = text;
  message.className = success ? "success" : "error";

}

</script>

</body>
</html>
