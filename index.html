
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Relay Email Submission</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #111827;
      margin-top: 0;
      margin-bottom: 12px;
    }

    .description {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    input[type="email"] {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input[type="email"]:focus {
      border-color: #2563eb;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.5;
    }

    .consent input {
      margin-top: 3px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #374151;
    }
  </style>

</head>

<body>

  <div class="container">

    <h2>Relay Email Submission</h2>

    <p class="description">
      Enter your relay email address below.
    </p>

    <form
      id="emailForm"
      action="https://script.google.com/macros/s/AKfycbxit6vNPjnkojMj_4gdaNKJGEZ6rrEEsLge1A3MKmXUfaWu0udE-2SaYqgS56kyOy_0SQ/exec"
      method="POST"
      target="hiddenFrame">

      <input
        type="email"
        name="email"
        placeholder="Enter your relay email address"
        autocomplete="email"
        required>

      <label class="consent">

        <input
          type="checkbox"
          name="consent"
          value="yes"
          required>

        <span>
          I agree to submit this email address
          and understand that it will be processed
          for the stated purpose.
        </span>

      </label>

      <button
        type="submit"
        id="submitBtn">

        Submit Email

      </button>

    </form>

    <iframe
      name="hiddenFrame"
      id="hiddenFrame"
      style="display:none">

    </iframe>

    <p id="message"></p>

  </div>

  <script>

    const form =
      document.getElementById("emailForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("submitBtn");

    const iframe =
      document.getElementById("hiddenFrame");

    let submitted = false;

    form.addEventListener("submit", function() {

      submitted = true;

      button.disabled = true;

      button.textContent = "Submitting...";

      message.textContent = "";

    });

    iframe.addEventListener("load", function() {

      if (submitted) {

        message.textContent =
          "Submission received. Thank you!";

        button.textContent = "Submitted";

        submitted = false;

      }

    });

  </script>

</body>

  </html>
