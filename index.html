
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relay Email Submission</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f3f5f9;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 30px 24px;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  color: #222;
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 25px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 9px;
  color: #333;
}

input[type="email"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

input[type="email"]:focus {
  border-color: #2563eb;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin: 20px 0;
  font-size: 13px;
  color: #555;
  line-height: 1.5;
}

.consent input {
  margin-top: 3px;
}

.consent label {
  font-weight: normal;
  margin: 0;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

#message {
  display: none;
  margin-top: 18px;
  padding: 12px;
  border-radius: 7px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
}

.success {
  display: block !important;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block !important;
  background: #fee2e2;
  color: #991b1b;
}

iframe {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <h2>Relay Email Submission</h2>

  <p class="subtitle">
    Submit your Craigslist relay email address below.
  </p>

  <form
    id="relayForm"
    method="POST"
    target="submitFrame"
    action="https://script.google.com/macros/s/AKfycbzKalDvOBKH6_x_nyJw0_kWYzmkd8hBGOozhLpbgAPunp1_EJq6wUlg2fj3hNEZe53fZw/exec"
  >

    <label for="email">Craigslist Relay Email</label>

    <input
      type="email"
      id="email"
      name="email"
      placeholder="example@res.craigslist.org"
      required
    >

    <div class="consent">

      <input
        type="checkbox"
        id="consent"
        name="consent"
        value="yes"
        required
      >

      <label for="consent">
        I confirm that I own or am authorized to submit
        this email address.
      </label>

    </div>

    <button type="submit" id="submitBtn">
      Submit Email
    </button>

  </form>

  <iframe name="submitFrame" id="submitFrame"></iframe>

  <div id="message"></div>

</div>

<script>

const form = document.getElementById("relayForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");
const frame = document.getElementById("submitFrame");

const emailInput = document.getElementById("email");

const emailPattern =
/^[a-z0-9._%+-]+@(?:reply|res)\.craigslist\.org$/i;

let submitting = false;
let submitTimer;

form.addEventListener("submit", function(e) {

  const email = emailInput.value.trim();

  if (!emailPattern.test(email)) {
    e.preventDefault();
    showMessage(
      "Please enter a valid Craigslist relay email address.",
      false
    );
    return;
  }

  if (!document.getElementById("consent").checked) {
    e.preventDefault();
    showMessage("Consent is required.", false);
    return;
  }

  if (submitting) {
    e.preventDefault();
    return;
  }

  submitting = true;

  button.disabled = true;
  button.textContent = "Submitting...";

  message.style.display = "none";

  submitTimer = setTimeout(function() {
    if (submitting) {
      submitting = false;
      button.disabled = false;
      button.textContent = "Submit Email";

      showMessage(
        "No confirmation received. Please check your connection and try again.",
        false
      );
    }
  }, 20000);

});

// Receive actual Google Apps Script response
window.addEventListener("message", function(event) {

  if (event.origin !== "https://script.google.com") {
    return;
  }

  const data = event.data;

  if (!data || data.type !== "relay-result") {
    return;
  }

  if (!submitting) return;

  clearTimeout(submitTimer);
  submitting = false;

  button.disabled = false;
  button.textContent = "Submit Email";

  showMessage(data.message, data.success);

  if (data.success) {
    form.reset();
  }

});

function showMessage(text, success) {

  message.textContent = text;
  message.className = success ? "success" : "error";
  message.style.display = "block";

}

</script>

</body>
</html>
